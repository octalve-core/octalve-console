name: Deploy Octalve Console Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: octalve-console-frontend-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Deploy frontend to console.octalve.cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate required secrets
        run: |
          test -n "${{ secrets.DEPLOY_HOST }}"
          test -n "${{ secrets.DEPLOY_USER }}"
          test -n "${{ secrets.DEPLOY_PORT }}"
          test -n "${{ secrets.DEPLOY_KEY }}"
          test -n "${{ secrets.APP_PATH }}"
          test -n "${{ secrets.NEXT_PUBLIC_API_BASE_URL }}"

      - name: Prepare SSH
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_KEY }}" | tr -d '\r' > ~/.ssh/octalve_console_deploy
          chmod 600 ~/.ssh/octalve_console_deploy
          ssh-keyscan -H -p "${{ secrets.DEPLOY_PORT }}" "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts

      - name: Create app directory on server
        run: |
          ssh -i ~/.ssh/octalve_console_deploy \
            -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "mkdir -p '${{ secrets.APP_PATH }}'"

      - name: Upload project files
        run: |
          rsync -az --delete \
            --exclude ".git" \
            --exclude ".github" \
            --exclude "node_modules" \
            --exclude "frontend/.next" \
            --exclude "frontend/node_modules" \
            --exclude "backend" \
            --exclude "docs" \
            --exclude "package-lock.json" \
            --exclude "yarn.lock" \
            -e "ssh -i ~/.ssh/octalve_console_deploy -p ${{ secrets.DEPLOY_PORT }}" \
            ./ "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.APP_PATH }}/"

      - name: Create production environment file
        run: |
          cat > /tmp/octalve-console.env <<EOF
          NEXT_PUBLIC_APP_URL=https://console.octalve.cloud
          NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_APP_VERSION=production
          NEXT_PUBLIC_ALLOW_FALLBACK_DATA=false
          EOF

          sed -i 's/^          //' /tmp/octalve-console.env

          scp -i ~/.ssh/octalve_console_deploy \
            -P "${{ secrets.DEPLOY_PORT }}" \
            /tmp/octalve-console.env \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:${{ secrets.APP_PATH }}/frontend/.env.production"

      - name: Install, build and restart frontend
        run: |
          ssh -i ~/.ssh/octalve_console_deploy \
            -p "${{ secrets.DEPLOY_PORT }}" \
            "${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}" \
            "cd '${{ secrets.APP_PATH }}' &&
             node -v &&
             pnpm -v &&
             pnpm install --frozen-lockfile &&
             pnpm --filter octalve-console-frontend build &&
             pm2 startOrReload ecosystem.config.cjs --update-env &&
             pm2 save"
