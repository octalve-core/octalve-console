components:
  schemas:
    APIAccessLog:
      type: object
      description: Serializer for API access logs
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
          nullable: true
        user_name:
          type: string
          readOnly: true
        user_email:
          type: string
          format: email
          readOnly: true
        api_key_id:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
          nullable: true
        method:
          type: string
          maxLength: 10
        path:
          type: string
          maxLength: 500
        query_string:
          type: string
          nullable: true
        status_code:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        response_time_ms:
          type: integer
          maximum: 9223372036854775807
          minimum: -9223372036854775808
          format: int64
        ip_address:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - ip_address
      - method
      - path
      - response_time_ms
      - status_code
      - user_email
      - user_name
    ActionTypeEnum:
      enum:
      - change_priority
      - assign_staff
      - notify_staff
      - move_department
      type: string
      description: |-
        * `change_priority` - Change Priority
        * `assign_staff` - Assign to Staff
        * `notify_staff` - Notify Staff
        * `move_department` - Move to Department
    Activation:
      type: object
      properties:
        uid:
          type: string
        token:
          type: string
      required:
      - token
      - uid
    ActivationRequest:
      type: object
      properties:
        uid:
          type: string
          minLength: 1
        token:
          type: string
          minLength: 1
      required:
      - token
      - uid
    AdapterTypeEnum:
      enum:
      - DirectAdminAdapter
      - CpanelAdapter
      - PleskAdapter
      - VirtualizorAdapter
      - ProxmoxAdapter
      - EnhanceAdapter
      - PterodactylAdapter
      - VirtFusionAdapter
      - CloudflareAdapter
      - DomainRegistrarAdapter
      - SslProviderAdapter
      - EmailProviderAdapter
      - BackupProviderAdapter
      - CustomProviderAdapter
      type: string
      description: |-
        * `DirectAdminAdapter` - DirectAdmin
        * `CpanelAdapter` - cPanel/WHM
        * `PleskAdapter` - Plesk
        * `VirtualizorAdapter` - Virtualizor
        * `ProxmoxAdapter` - Proxmox VE
        * `EnhanceAdapter` - Enhance
        * `PterodactylAdapter` - Pterodactyl
        * `VirtFusionAdapter` - VirtFusion
        * `CloudflareAdapter` - Cloudflare
        * `DomainRegistrarAdapter` - Domain Registrar
        * `SslProviderAdapter` - SSL Provider
        * `EmailProviderAdapter` - Email Provider
        * `BackupProviderAdapter` - Backup Provider
        * `CustomProviderAdapter` - Custom
    AuditLog:
      type: object
      description: Serializer for audit logs
      properties:
        id:
          type: integer
          readOnly: true
        actor:
          type: integer
          nullable: true
        actor_name:
          type: string
          readOnly: true
        actor_email:
          type: string
          format: email
          nullable: true
          maxLength: 254
        actor_role:
          type: string
          nullable: true
          maxLength: 20
        actor_ip:
          type: string
          nullable: true
        action:
          $ref: '#/components/schemas/AuditLogActionEnum'
        action_display:
          type: string
          readOnly: true
        entity_type:
          type: string
          nullable: true
          maxLength: 100
        entity_id:
          type: string
          nullable: true
          maxLength: 100
        entity_name:
          type: string
          nullable: true
          maxLength: 500
        old_value:
          nullable: true
        new_value:
          nullable: true
        details: {}
        error_message:
          type: string
          nullable: true
        request_method:
          type: string
          nullable: true
          maxLength: 10
        request_path:
          type: string
          nullable: true
          maxLength: 500
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - action
      - action_display
      - actor_name
      - created_at
      - id
    AuditLogActionEnum:
      enum:
      - login
      - logout
      - login_failed
      - password_reset
      - password_changed
      - email_changed
      - user_created
      - user_updated
      - user_deleted
      - user_suspended
      - user_activated
      - role_assigned
      - role_removed
      - order_created
      - order_updated
      - order_cancelled
      - order_paid
      - invoice_created
      - invoice_paid
      - invoice_cancelled
      - invoice_overdue
      - payment_initiated
      - payment_completed
      - payment_failed
      - payment_refunded
      - webhook_received
      - wallet_credited
      - wallet_debited
      - withdrawal_requested
      - withdrawal_approved
      - withdrawal_completed
      - service_provisioned
      - service_suspended
