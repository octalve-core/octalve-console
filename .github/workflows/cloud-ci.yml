name: Cloud C1 backend security checks
on:
  push:
    branches:
      - review/cloud
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/cloud-ci.yml"
      - "docs/CLOUD_**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Verify migration script shell syntax (does not access database)
        run: bash -n backend/scripts/run_review_migrations.sh
      - name: Verify gateway signature contracts
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit pinned Python supply chain
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps --progress-spinner off -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Activate locked pnpm version
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: BFF canonical Django paths (regression)
        run: node frontend/scripts/test-cloud-api-path.cjs
      - name: Customer production copy and truthful account-state regression
        run: node frontend/scripts/check-production-customer-copy.cjs
      - name: Console UI frozen baseline (Batch 0)
        run: node frontend/scripts/audit-console-ui.cjs --check
      - name: Typed Console design-system source contract (Batch 1)
        run: node frontend/scripts/check-console-design-system.cjs
      - name: TypeScript
        run: pnpm typecheck:frontend
      - name: Next.js build
        run: pnpm build:frontend
      - name: Workspace contrast and emitted Tailwind CSS regression
        run: node frontend/scripts/check-contrast-safe-cloud-panels.cjs --built
      - name: Console design system emitted Tailwind regression
        run: node frontend/scripts/check-console-design-system.cjs --built

  django-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-do-not-deploy"
      FRONTEND_URL: "http://localhost:3000"
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Detect missing migrations before any real deployment
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Django production deployment security review (fail on security warnings)
        working-directory: backend
        env:
          DEBUG: "false"
          DATABASE_URL: "sqlite:///:memory:"
          # Only CI: avoid a false weak-key warning from the earlier short fixture.
          DJANGO_SECRET_KEY: "CI-ONLY-NEVER-DEPLOY-12345-abcdefghijklmnopqrstuvwxyz-ABCDE-67890"
        run: python scripts/security_release_check.py
      - name: Real Django API and isolated database regression
        working-directory: backend
        run: python manage.py test catalog.test_public_storefront accounts.tests accounts.test_account_self_service orders.tests orders.test_premium_checkout support.test_routing knowledge_base.tests tests.test_biz01_authority catalog.tests catalog.test_offer_workflows provisioning.test_authority provisioning.test_completion_authority provisioning.test_paid_funnel notifications.test_hosting_ready domains.test_registrar_quote payments.test_readback payments.test_checkout_webhooks services.test_opanel opanel_bridge.tests opanel_bridge.test_readback --verbosity=2
      - name: BIZ-01 financial write authority regression
        working-directory: backend
        run: python manage.py test tests.test_biz01_authority --verbosity=2
      - name: Review revised auth migration plan (read-only, isolated CI)
        working-directory: backend
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan
          plan = capture_django_plan(Path.cwd(), os.environ.copy())
          print('AUTH_REVIEW_PLAN_BEGIN')
          print(plan.stdout, end='')
          print('AUTH_REVIEW_PLAN_END')
          print('AUTH_REVIEW_PLAN_SHA256=' + hashlib.sha256(plan.stdout.encode('utf-8')).hexdigest())
          PY
      - name: Verify immutable auth baseline and reject it as the SEC-01 migration plan
        working-directory: backend
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan, verify_reviewed_plan
          backend = Path.cwd()
          repo = backend.parent
          transcript = capture_django_plan(backend, os.environ.copy()).stdout
          approved = (repo / 'docs' / 'CLOUD_FOUNDATION_AUTH_BLACKLIST_INITIAL_MIGRATION_CANDIDATE_2026-10-23.md').read_text(encoding='utf-8')
          marker = '```text\n'
          begin = approved.find(marker)
          end = approved.find('\n```', begin + len(marker))
          assert begin >= 0 and end > begin, 'Historical transcript missing'
          reference = approved[begin + len(marker):end] + '\n'
          assert hashlib.sha256(reference.encode('utf-8')).hexdigest() == '516cd378502964020838c5d23b89caf172bd1cf135677172ee85e4795892a8cd'
          assert 'accounts.0003_auththrottlebucket' in transcript
          migrations = [line for line in transcript.splitlines() if line and not line.startswith(' ') and line != 'Planned operations:']
          assert len(migrations) == 54, f'Expected 49 historical + 3 foundation + 2 support/help migrations, got {len(migrations)}'
          assert 'catalog.0002_catalog_offers' in transcript, 'Catalog draft/revision migration missing'
          assert 'notifications.0001_hosting_ready_outbox' in transcript, 'Hosting notice outbox migration missing'
          try:
              verify_reviewed_plan(transcript, repo)
          except SystemExit as exc:
              assert 'Migration REFUSED: plan differs from locked reviewed migrations' in str(exc)
          else:
              raise AssertionError('Old 36-migration runner must reject SEC01 schema')
          print('PASS: historical 48/217 digest intact; incremental SEC-01 plan separately identified; old runner rejects it.')
          PY
