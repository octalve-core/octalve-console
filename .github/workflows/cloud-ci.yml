name: Cloud C1 backend security checks
on:
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/cloud-ci.yml"
      - "docs/CLOUD_**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Verify migration script shell syntax (does not access database)
        run: bash -n backend/scripts/run_review_migrations.sh
      - name: Verify gateway signature contracts
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit pinned Python supply chain
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps --progress-spinner off -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Activate locked pnpm version
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: TypeScript
        run: pnpm typecheck:frontend
      - name: Next.js build
        run: pnpm build:frontend

  django-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-do-not-deploy"
      FRONTEND_URL: "http://localhost:3000"
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Detect missing migrations before any real deployment
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Django production deployment security review (fail on security warnings)
        working-directory: backend
        env:
          DEBUG: "false"
          DATABASE_URL: "sqlite:///:memory:"
          # Only CI: avoid a false weak-key warning from the earlier short fixture.
          DJANGO_SECRET_KEY: "CI-ONLY-NEVER-DEPLOY-12345-abcdefghijklmnopqrstuvwxyz-ABCDE-67890"
        run: python scripts/security_release_check.py
      - name: Real Django API and isolated database regression
        working-directory: backend
        run: python manage.py test accounts.tests --verbosity=2
      - name: Review revised auth migration plan (read-only, isolated CI)
        working-directory: backend
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan
          plan = capture_django_plan(Path.cwd(), os.environ.copy())
          print('AUTH_REVIEW_PLAN_BEGIN')
          print(plan.stdout, end='')
          print('AUTH_REVIEW_PLAN_END')
          print('AUTH_REVIEW_PLAN_SHA256=' + hashlib.sha256(plan.stdout.encode('utf-8')).hexdigest())
          PY
      - name: Verify reviewed migration-plan fingerprint (no migrations applied)
        working-directory: backend
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan, verify_reviewed_plan
          backend = Path.cwd()
          result = capture_django_plan(backend, os.environ.copy())
          verify_reviewed_plan(result.stdout, backend.parent)
          PY
