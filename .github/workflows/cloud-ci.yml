name: Cloud C1 backend security checks
on:
  push:
    branches:
      - review/cloud
  pull_request:
    paths:
      - "backend/**"
      - "frontend/**"
      - "pnpm-lock.yaml"
      - "package.json"
      - ".github/workflows/cloud-ci.yml"
      - "docs/CLOUD_**"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Compile Python
        run: python -m compileall -q backend
      - name: Verify migration script shell syntax (does not access database)
        run: bash -n backend/scripts/run_review_migrations.sh
      - name: Verify gateway signature contracts
        working-directory: backend
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit pinned Python supply chain
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --disable-pip --no-deps --progress-spinner off -r backend/requirements.txt

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Activate locked pnpm version
        run: corepack enable && corepack prepare pnpm@9.15.9 --activate
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: BFF canonical Django paths (regression)
        run: node frontend/scripts/test-cloud-api-path.cjs
      - name: Customer production copy and truthful account-state regression
        run: node frontend/scripts/check-production-customer-copy.cjs
      - name: Console UI frozen baseline (Batch 0)
        run: node frontend/scripts/audit-console-ui.cjs --check
      - name: Typed Console design-system source contract (Batch 1)
        run: node frontend/scripts/check-console-design-system.cjs
      - name: TypeScript
        run: pnpm typecheck:frontend
      - name: Next.js build
        run: pnpm build:frontend
      - name: Workspace contrast and emitted Tailwind CSS regression
        run: node frontend/scripts/check-contrast-safe-cloud-panels.cjs --built
      - name: Console design system emitted Tailwind regression
        run: node frontend/scripts/check-console-design-system.cjs --built
      - name: Shared Console shell and auth Tailwind contract (Batch 2)
        run: node frontend/scripts/check-console-shell.cjs --built
      - name: Client essentials design-system and API authority regression (Batch 3)
        run: node frontend/scripts/check-client-essentials.cjs --built
      - name: Client commerce and payment authority UI regression (Batch 4)
        run: node frontend/scripts/check-client-commerce.cjs --built
      - name: Support and knowledge module authority regression (Batch 5)
        run: node frontend/scripts/check-support-knowledge.cjs --built
      - name: Staff Console interface and read-only authority regression (Batch 6)
        run: node frontend/scripts/check-staff-console.cjs --built
      - name: Admin Console and server-authority regression (Batch 7)
        run: node frontend/scripts/check-admin-console.cjs --built
      - name: Audit every route and legacy CSS consumer (Batch 8)
        run: node frontend/scripts/audit-legacy-css.cjs --json frontend/.next/batch8-css-audit.json
      - name: Enforce Batch 8 single Tailwind config and legacy CSS safety gate
        run: node frontend/scripts/check-css-retirement-gates.cjs --built
      - name: Auth logo parity and shared Tailwind component migration
        run: node frontend/scripts/check-batch8-shared-migration.cjs --built
      - name: Prepare 123-route responsive browser acceptance manifest
        run: node frontend/scripts/browser-parity-qualification.cjs --plan frontend/.next/batch8-browser-qa.json
      - name: Admin B1 draft connection readback and authority guard
        run: node frontend/scripts/check-admin-b1-draft-readback.cjs
      - name: Admin navigation and safe Integration Store contract
        run: node frontend/scripts/check-admin-a2-integration-store.cjs
      - name: Admin Settings route and truthful management link contract
        run: node frontend/scripts/check-admin-settings-routing.cjs
      - name: Admin A1 nonrouting modular editor and production copy regression
        run: node frontend/scripts/check-admin-a1-structure.cjs
      - name: Admin payment and editor truthfulness integration regression
        run: node frontend/scripts/check-admin-integration-safety.cjs --built
      - name: Admin workspace live-vs-unconnected service qualification
        run: node frontend/scripts/check-admin-workspace-coverage.cjs --built
      - name: Phase 1 exact Admin identity and changed-field edit qualification
        run: node --experimental-strip-types frontend/scripts/check-phase1-admin-authority.cjs
      - name: Phase 1 and 2 client data recovery and Tailwind accessibility
        run: node frontend/scripts/check-phase12-client-recovery.cjs --built
      - name: Phase 3 Console-to-Django route and tenant contract guard
        run: node frontend/scripts/check-phase3-django-route-contract.cjs
      - name: Batch 9 dynamic catalogue, navigation and responsive record contract
        run: node frontend/scripts/check-batch9-client-foundation.cjs --built
      - name: Batch 10 owned Services, usage and renewal authority contract
        run: node frontend/scripts/check-batch10-service-authority.cjs
      - name: Batch 11 domain management, registrar readiness and ownership contract
        run: node frontend/scripts/check-batch11-domain-contract.cjs
      - name: Batch 12 customer notification security and community contract
        run: node frontend/scripts/check-batch12-notice-integrity.cjs
      - name: Batch 13 rewards and affiliate authority contract
        run: node frontend/scripts/check-batch13-rewards.cjs
      - name: Batch 14 language, BFF owner-scope and formatting contract
        run: node --experimental-strip-types frontend/scripts/check-batch14-internationalization.cjs
      - name: Batch 15 signed evidence rejection and browser qualification boundary
        run: node frontend/scripts/check-batch15-browser-gates.cjs
      - name: Batch 16 invoice template Studio and financial authority
        run: node frontend/scripts/check-batch16-invoice-studio.cjs
      - name: Batch 17 read-only renewal review and no financial mutation
        run: node frontend/scripts/check-batch17-renewal-preflight.cjs
      - name: Batch 18 owner-checked staff overview and private field exclusion
        run: node frontend/scripts/check-batch18-staff-readback.cjs

  django-check:
    runs-on: ubuntu-latest
    env:
      DJANGO_SECRET_KEY: "ci-only-not-a-real-secret-do-not-deploy"
      FRONTEND_URL: "http://localhost:3000"
      DEBUG: "true"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      ENCRYPTION_KEY: ""
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Django system check
        working-directory: backend
        run: python manage.py check
      - name: Detect missing migrations before any real deployment
        working-directory: backend
        run: python manage.py makemigrations --check --dry-run
      - name: Django production deployment security review (fail on security warnings)
        working-directory: backend
        env:
          DEBUG: "false"
          DATABASE_URL: "sqlite:///:memory:"
          # Only CI: avoid a false weak-key warning from the earlier short fixture.
          DJANGO_SECRET_KEY: "CI-ONLY-NEVER-DEPLOY-12345-abcdefghijklmnopqrstuvwxyz-ABCDE-67890"
        run: python scripts/security_release_check.py
      - name: Real Django API and isolated database regression
        working-directory: backend
        run: python manage.py test catalog.test_public_storefront accounts.tests accounts.test_account_self_service orders.tests orders.test_premium_checkout billing.tests support.test_routing knowledge_base.tests tests.test_biz01_authority catalog.tests catalog.test_offer_workflows provisioning.test_authority provisioning.test_completion_authority provisioning.test_paid_funnel notifications.test_hosting_ready notifications.tests rewards.tests rewards.test_financial_qualification domains.test_registrar_quote payments.test_readback payments.test_checkout_webhooks services.test_opanel opanel_bridge.tests opanel_bridge.test_readback providers.test_provider_hardening providers.test_draft_vault providers.test_stepup providers.test_vault_keyring providers.test_pinned_egress providers.test_audit_integrity providers.test_isolated_recovery providers.test_audit_checkpoint providers.test_worm_checkpoint providers.test_kms_custody --verbosity=2
      - name: Render synthetic invoice Template 01 visual QA samples (no database)
        run: |
          python backend/billing/invoice-template/preview_template_01.py --output backend/invoice-template-01-preview.pdf
          python backend/billing/invoice-template/preview_template_01.py --long --output backend/invoice-template-01-long-preview.pdf
      - name: Upload safe synthetic invoice PDF QA artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: octalve-invoice-template-01-visual-review
          path: |
            backend/invoice-template-01-preview.pdf
            backend/invoice-template-01-long-preview.pdf
          if-no-files-found: error
          retention-days: 7
      - name: BIZ-01 financial write authority regression
        working-directory: backend
        run: python manage.py test tests.test_biz01_authority --verbosity=2
      - name: Review revised auth migration plan (read-only, isolated CI)
        working-directory: backend
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan
          plan = capture_django_plan(Path.cwd(), os.environ.copy())
          print('AUTH_REVIEW_PLAN_BEGIN')
          print(plan.stdout, end='')
          print('AUTH_REVIEW_PLAN_END')
          print('AUTH_REVIEW_PLAN_SHA256=' + hashlib.sha256(plan.stdout.encode('utf-8')).hexdigest())
          PY
      - name: Verify immutable auth baseline and reject it as the SEC-01 migration plan
        working-directory: backend
        run: |
          python - <<'PY'
          import os, hashlib
          from pathlib import Path
          from scripts.review_neon_migration_cli import capture_django_plan, verify_reviewed_plan
          backend = Path.cwd()
          repo = backend.parent
          transcript = capture_django_plan(backend, os.environ.copy()).stdout
          approved = (repo / 'docs' / 'CLOUD_FOUNDATION_AUTH_BLACKLIST_INITIAL_MIGRATION_CANDIDATE_2026-10-23.md').read_text(encoding='utf-8')
          marker = '```text\n'
          begin = approved.find(marker)
          end = approved.find('\n```', begin + len(marker))
          assert begin >= 0 and end > begin, 'Historical transcript missing'
          reference = approved[begin + len(marker):end] + '\n'
          assert hashlib.sha256(reference.encode('utf-8')).hexdigest() == '516cd378502964020838c5d23b89caf172bd1cf135677172ee85e4795892a8cd'
          assert 'accounts.0003_auththrottlebucket' in transcript
          migrations = [line for line in transcript.splitlines() if line and not line.startswith(' ') and line != 'Planned operations:']
          assert len(migrations) == 58, f'Expected 49 historical + 3 foundation + 2 support/help + 1 rewards + 1 provider-vault migration, got {len(migrations)}'
          assert 'catalog.0002_catalog_offers' in transcript, 'Catalog draft/revision migration missing'
          assert 'notifications.0001_hosting_ready_outbox' in transcript, 'Hosting notice outbox migration missing'
          try:
              verify_reviewed_plan(transcript, repo)
          except SystemExit as exc:
              assert 'Migration REFUSED: plan differs from locked reviewed migrations' in str(exc)
          else:
              raise AssertionError('Old 36-migration runner must reject SEC01 schema')
          print('PASS: historical 48/217 digest intact; incremental SEC-01 plan separately identified; old runner rejects it.')
          PY
