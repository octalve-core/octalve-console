# STAGED FOR FUTURE REVIEW: not manually dispatchable until this workflow also
# exists on GitHub's default branch. Do not merge to main without owner approval.
# Current runnable method: backend/scripts/run_review_migrations.sh in a
# restricted Codespace with the review-only Neon direct URL as a Codespaces secret.
name: Octalve Cloud — manually approved Neon review migrations

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan migrations or apply after reviewing plan"
        type: choice
        required: true
        default: plan
        options:
          - plan
          - apply
      confirmation:
        description: "For apply, enter exactly: APPLY TO OCTALVE REVIEW ONLY"
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: octalve-cloud-review-database-migrations
  cancel-in-progress: false

jobs:
  review-neon-migration:
    # This workflow never runs from main, tags, feature branches or PRs.
    if: github.ref == 'refs/heads/review/cloud-portability-security-foundation'
    runs-on: ubuntu-latest
    environment: cloud-review-migrations
    timeout-minutes: 20
    env:
      # GitHub Environment secret. Enter only in GitHub Settings, never a PR.
      DATABASE_URL: ${{ secrets.CLOUD_REVIEW_DATABASE_URL_UNPOOLED }}
      DJANGO_SECRET_KEY: "temporary-migration-cli-only-not-a-deployment-key"
      FRONTEND_URL: "https://octalve-console.vercel.app"
      DEBUG: "false"
      VERCEL_ENV: "preview"
      OCTALVE_CLOUD_ENV: "review"
      CLOUD_REVIEW_MIGRATION_CONFIRM: "approved-from-dispatch"
    steps:
      - name: Checkout approved branch commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Verify secret configured and apply confirmation
        env:
          OPERATION: ${{ inputs.operation }}
          CONFIRMATION: ${{ inputs.confirmation }}
        shell: bash
        run: |
          test -n "$DATABASE_URL" || { echo "Missing CLOUD_REVIEW_DATABASE_URL_UNPOOLED environment secret"; exit 1; }
          if [ "$OPERATION" = apply ] && [ "$CONFIRMATION" != "APPLY TO OCTALVE REVIEW ONLY" ]; then
            echo "Explicit confirmation missing: migration not applied"
            exit 1
          fi
      - name: Install dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify database identity, TLS and migration ledger
        run: python backend/scripts/review_db_preflight.py
      - name: Django migration plan (read-only)
        working-directory: backend
        run: python manage.py migrate --plan
      - name: Apply migrations (only on explicit approved dispatch)
        if: inputs.operation == 'apply' && inputs.confirmation == 'APPLY TO OCTALVE REVIEW ONLY'
        working-directory: backend
        run: python manage.py migrate --noinput
      - name: Confirm applied migration ledger
        if: inputs.operation == 'apply' && inputs.confirmation == 'APPLY TO OCTALVE REVIEW ONLY'
        working-directory: backend
        run: python manage.py showmigrations --plan
